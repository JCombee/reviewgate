name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The tag is the single source of truth for what a binary says it is. A
      # package.json left behind on an older version would ship a binary that lies
      # about itself to the update check, so fail here instead.
      - name: Check the manifests match the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fail=0
          for manifest in package.json packages/*/package.json plugin/.claude-plugin/plugin.json; do
            # A missing manifest (a rename, or a glob that matched nothing and came
            # through literally) must report itself and let the loop finish, not kill
            # the step on a node stack trace under `bash -e`.
            if [ ! -f "$manifest" ]; then
              echo "missing $manifest" >&2
              fail=1
              continue
            fi
            if ! found="$(node -p "require('./$manifest').version")"; then
              echo "could not read a version from $manifest" >&2
              fail=1
              continue
            fi
            if [ "$found" != "$VERSION" ]; then
              echo "$manifest is $found but the tag is $VERSION" >&2
              fail=1
            fi
          done
          # A CHANGELOG that never learned about this version is a release nobody can
          # read; the .claude/skills/release skill writes that section before tagging.
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${VERSION}" >&2
            fail=1
          fi
          exit $fail

      - run: npm ci

      # Some tests spawn the built CLI, so the build comes first. It also means a
      # broken build fails here rather than halfway through the compile.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Compile the binaries
        run: node scripts/build-binaries.mjs --version "${{ steps.version.outputs.version }}" --out release

      - name: Checksums
        run: |
          cd release
          ls -la
          cat *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: release/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            release/*
